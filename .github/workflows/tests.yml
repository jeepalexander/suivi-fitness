name: Tests

# Lance les tests automatiques à chaque envoi de code et à chaque demande de fusion.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright et Chromium
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
      - name: Lancer les tests
        run: python3 tests/run_tests.py
